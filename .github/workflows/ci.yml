name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: pytest -q
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f compose.gpu.yaml \
            --profile local --profile voice --profile home --profile workspace --profile remote config -q
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh

  image:
    # Construye la imagen hestia-agent (Hermes + Claude Code) y comprueba que el CLI y el wrapper existen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: |
          docker build -f docker/Dockerfile -t hestia-agent:ci .
          docker run --rm --entrypoint sh hestia-agent:ci -c 'claude --version && test -x /usr/local/bin/claude-hestia'
