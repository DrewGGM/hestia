name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: pytest -q
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f compose.gpu.yaml \
            --profile local --profile voice --profile home --profile workspace --profile remote config -q
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh
